<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Insider Threat Detection System – Analyst Login">
    <title>Login – Insider Threat Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

    <!-- Subtle animated grid background -->
    <div class="bg-grid" aria-hidden="true"></div>
    <!-- Soft radial glow -->
    <div class="bg-glow" aria-hidden="true"></div>

    <div class="login-wrapper">
        <div class="login-card">

            <!-- Logo / Icon -->
            <div class="card-icon" aria-hidden="true">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <circle cx="12" cy="11" r="2.5" fill="currentColor" stroke="none" opacity="0.6"/>
                    <line x1="12" y1="13.5" x2="12" y2="16"/>
                </svg>
            </div>

            <!-- Title -->
            <h1 class="card-title">THREAT SYSTEM</h1>
            <p class="card-subtitle">Sign in to access the Security Operations Console</p>

            <!-- Flash messages from Flask -->
            {% if error %}
            <div class="alert alert-error" role="alert">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                {{ error }}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form id="loginForm" method="POST" action="/login" novalidate>
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-input"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                            value="{{ username_val or '' }}"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword"
                                aria-label="Toggle password visibility">
                            <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-meta">
                    <label class="remember-label" for="remember">
                        <input type="checkbox" id="remember" name="remember" class="remember-check">
                        <span class="check-box" aria-hidden="true"></span>
                        Remember me
                    </label>
                    <span class="forgot-link" title="Contact your system administrator">Forgot password?</span>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner" id="loginSpinner" aria-hidden="true"></span>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider"><span>system info</span></div>

            <!-- System info footer inside card -->
            <div class="system-info">
                <span class="info-badge">
                    <span class="status-dot" aria-hidden="true"></span>
                    System Online
                </span>
                <span class="info-text">Rule-based Engine v1.0</span>
                <span class="info-text">SQLite · Local</span>
            </div>

        </div><!-- /.login-card -->

        <p class="page-footer">
            Insider Threat Detection System &nbsp;·&nbsp; Internal Use Only
        </p>
    </div>

    <script>
        // Toggle password visibility
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleBtn.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            eyeIcon.innerHTML = isHidden
                ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                   <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                   <line x1="1" y1="1" x2="23" y2="23"/>`
                : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                   <circle cx="12" cy="12" r="3"/>`;
        });

        // Show spinner on submit
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const spinner = document.getElementById('loginSpinner');

        form.addEventListener('submit', (e) => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) { e.preventDefault(); return; }
            loginBtn.disabled = true;
            spinner.style.display = 'inline-block';
        });
    </script>
</body>
</html>
